name: main_project
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number is used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts of the
# product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

# The Dart SDK version required by this project.
environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs to work.
# To automatically upgrade your package dependencies to the latest versions,
# consider running `flutter pub upgrade --major-versions`.
dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter

  # Cupertino Icons for iOS-style icons.
  cupertino_icons: ^1.0.8

  # Access commonly used locations on the device filesystem.
  path_provider: ^2.1.6

  # Create responsive layouts based on screen size.
  flutter_screenutil: ^5.9.3

  # Display SVG images.
  flutter_svg: ^2.3.0

  # Hive local database.
  hive: ^2.2.3

  # Hive CE Flutter integration.
  hive_ce_flutter: ^2.3.4

# Development-only dependencies.
dev_dependencies:
  # Flutter testing framework.
  flutter_test:
    sdk: flutter

  # Recommended Flutter lint rules.
  flutter_lints: ^6.0.0

  # Generates code automatically.
  build_runner: ^2.4.13

  # Generates Hive type adapters.
  hive_generator: ^2.0.1

# Flutter-specific configuration.
flutter:

  # Includes Material Icons in the application.
  uses-material-design: true

  # Application assets.
  assets:
    - assets/images/
    - assets/images/svgs/

  # Resolution-aware image variants can be configured here.
  # See:
  # https://flutter.dev/to/resolution-aware-images

  # Package assets can be configured here.
  # See:
  # https://flutter.dev/to/asset-from-package

  # Custom fonts can be configured here.
  #
  # Example:
  #
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700